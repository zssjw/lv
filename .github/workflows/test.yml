name: Auto Deploy to Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare worker script
        run: |
          if [ -f "明文源吗" ]; then
            cp "明文源吗" "worker.js"
          elif [ -f "_worker.js" ]; then
            cp "_worker.js" "worker.js"
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy worker.js --name lv --compatibility-date 2024-09-01 --var u:b4931764-f8c2-4bb7-bcb3-fabdeb29529e
